<html>
<head>
    <title>Document</title>
</head>
<body>
    <div style="display: flex;justify-content: center;">
    <form>
  <fieldset style="width: 210px; background-color: lightblue; border-radius: 10px; border: 2px solid black;">
    <h3>Account Information</h3>
    <label>Name:</label>
    <input type="text" name="name">

    <label>Email:</label>
    <input type="email" name="email">
    
    <label>Password:</label>
    <input type="password" name="password" maxlength="8">

    <label>Age:</label>
    <input type="number" min="18" max="100" name="age">

    <div>
    <label>Gender:</label>
    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female"> Female
    </div>

    <label>Course:</label>
    <select name="course">
        <option value="mca">MCA</option>
        <option value="bca">BCA</option>
        <option value="btech">B.Tech</option>
    </select> 
    <div>
    <label for="skill">SKILL:</label>
    <input type="checkbox" value="Java">JAVA
    <input type="checkbox" value="HTML">HTML
    <input type="checkbox" value="CSS">CSS
    <input type="checkbox" value="JavaScript">JAVASCRIPT
    </div>

    <label>Address:</label>
    <textarea name="address"></textarea>
    
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

  </fieldset>
</form>
</div>
</body>
</html>
