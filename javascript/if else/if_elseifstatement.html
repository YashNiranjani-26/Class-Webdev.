<!DOCTYPE html>
<html lang="en">
<head>
    <title>elseif statement</title>
</head>
<body>
    
</body>
<script>
    var num = -100;
    if (num>0)
    {
        document.write("Number is Positive");
    }
    else if (num<0)
    {
        document.write("Number is Negative");
    }
    else 
    {
        document.write("Number  is Zero");
    }
</script>
</html>
